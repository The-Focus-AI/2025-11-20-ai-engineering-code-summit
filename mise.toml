[tools]
bun = "latest"
node = "latest"
"npm:@anthropic-ai/claude-code" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@openai/codex" = "latest"

[tasks.dev]
description = "Start development server"
run = "cd web && npm run dev"

[tasks.build]
description = "Build website for production"
run = "cd web && npm run build"

[tasks.build-site]
description = "Build with base path and copy to outdir"
usage = '''
arg "<base>" help="Base path for the site (e.g., /reports/aiecode-2025-11/)"
arg "<outdir>" help="Output directory to copy built files to"
'''
run = '''
echo "Building site with base ${usage_base} and outdir ${usage_outdir}"
cd web
npm install
BASE_PATH="${usage_base}" npx astro build
echo "Copying site to ${usage_outdir}"
mkdir -p "${usage_outdir}"
cp -r dist/* "${usage_outdir}"
'''


[tasks.thefocus]
description = "Build and deploy to thefocus-landing"
run = "cd web && DEPLOY=thefocus npm run build && rsync -rv --delete dist/ ../../thefocus-landing/public/reports/aiecode-2025-11/"

[tasks.pdf]
description = "Generate PDF from /paged route using Playwright"
run = "cd web && npm run generate-pdf"
