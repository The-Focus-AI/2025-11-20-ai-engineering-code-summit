[tools]
bun = "latest"
node = "latest"
"npm:@anthropic-ai/claude-code" = "latest"
"npm:@google/gemini-cli" = "latest"
"npm:@openai/codex" = "latest"

[tasks.dev]
description = "Start development server"
run = "cd web && npm run dev"

[tasks.build]
description = "Build website for production"
run = "cd web && npm run build"

[tasks.preview]
description = "Preview production build"
run = "cd web && npm run preview"

[tasks.preview-static-site]
description = "Deploy to pgs.sh"
depends = ["build"]
run = "cd web && rsync -rv dist/ pgs.sh:/ai-engineering-code-summit/ && echo '\nDeployed to: https://combray-ai-engineering-code-summit.pgs.sh/'"
